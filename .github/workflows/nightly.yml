name: Nightly Package & Release

on:
  workflow_dispatch:
    inputs:
      package_macos_arm64:
        description: "Package macOS for Apple Silicon"
        required: true
        default: true
        type: boolean
      package_macos_x64:
        description: "Package macOS for Intel"
        required: true
        default: true
        type: boolean
      package_windows:
        description: "Package Windows for x64"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: coco-learn-nightly
  cancel-in-progress: false

jobs:
  prepare:
    # Manual runs build the nightly branch explicitly.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.result }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nightly

      - name: Record nightly commit
        id: checkout
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve nightly version from current stable tags
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const resolve = require('./desktop/scripts/resolve-release-version.cjs');
            const tags = await github.paginate(github.rest.repos.listTags, { ...context.repo, per_page: 100 });
            const result = resolve('auto', tags.map(tag => tag.name));
            const timestamp = new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14);
            const version = `${result.version}-nightly.${timestamp}`;
            core.setOutput('version', version);
            core.info(`Latest stable tag: ${result.current || '(none)'}; building: ${version}`);
            await core.summary.addHeading('Nightly release version').addTable([
              ['Latest stable tag', result.current || '(none)'],
              ['Building', version],
            ]).write();

      - name: Validate nightly release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          node --test desktop/scripts/set-release-version.test.mjs
          node --test desktop/scripts/resolve-release-version.test.cjs
          node desktop/scripts/set-release-version.mjs "$RELEASE_VERSION"

      - name: Prevent reusing a release tag
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            try {
              await github.rest.git.getRef({ ...context.repo, ref: `tags/v${process.env.RELEASE_VERSION}` });
              core.setFailed('This nightly tag already exists. Rerun after the next UTC second.');
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Test packaging recovery tooling
        run: node --test desktop/scripts/package-recovery.test.mjs

      - name: Test macOS update manifest tooling
        run: node --test desktop/scripts/create-mac-update-manifest.test.mjs

      - name: Build package matrix
        id: matrix
        uses: actions/github-script@v7
        env:
          PACKAGE_MACOS_ARM64: ${{ inputs.package_macos_arm64 }}
          PACKAGE_MACOS_X64: ${{ inputs.package_macos_x64 }}
          PACKAGE_WINDOWS: ${{ inputs.package_windows }}
        with:
          script: |
            const targets = [];

            if (process.env.PACKAGE_MACOS_ARM64 === "true") {
              targets.push({ os: "macos-15", platform: "macos", arch: "arm64" });
            }
            if (process.env.PACKAGE_MACOS_X64 === "true") {
              targets.push({ os: "macos-15-intel", platform: "macos-x64", arch: "x64" });
            }
            if (process.env.PACKAGE_WINDOWS === "true") {
              targets.push({ os: "windows-latest", platform: "windows", arch: "x64" });
            }

            if (targets.length === 0) {
              core.setFailed("Select at least one platform to package");
              return;
            }

            return { include: targets };

  package:
    needs: prepare
    env:
      COCO_GATEWAY_URL: ${{ vars.COCO_GATEWAY_URL || 'https://coco.upskilling.saltlab.stanford.edu' }}
      LLM_ROUTER_URL: ${{ vars.LLM_ROUTER_URL || 'https://coco.router.saltlab.stanford.edu' }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      # Run-scoped checkpoints intentionally have no fallback keys: never mix releases.
      - name: Identify package checkpoint
        id: checkpoint
        shell: bash
        env:
          CHECKPOINT_SOURCE: ${{ needs.prepare.outputs.commit }}
          CHECKPOINT_RUN: ${{ github.run_id }}
          CHECKPOINT_PLATFORM: ${{ matrix.platform }}
        run: |
          echo "ELECTRON_CACHE=$RUNNER_TEMP/electron-cache" >> "$GITHUB_ENV"
          node -e '
            const { createHash } = require("node:crypto");
            const { appendFileSync } = require("node:fs");
            const values = ["v1", process.env.CHECKPOINT_RUN, process.env.CHECKPOINT_SOURCE,
              process.env.CHECKPOINT_PLATFORM, process.env.RELEASE_VERSION,
              process.env.COCO_GATEWAY_URL, process.env.LLM_ROUTER_URL];
            const key = createHash("sha256").update(JSON.stringify(values)).digest("hex");
            appendFileSync(process.env.GITHUB_OUTPUT, `key=${key}\n`);
          '

      - name: Restore signed macOS app
        if: startsWith(matrix.platform, 'macos')
        id: signed
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/coco-signed.zip
          key: signed-app-${{ steps.checkpoint.outputs.key }}

      - name: Restore service build
        if: steps.signed.outputs.cache-hit != 'true'
        id: services
        uses: actions/cache/restore@v4
        with:
          path: desktop/service-dist
          key: services-${{ steps.checkpoint.outputs.key }}

      - name: Restore Electron downloads
        id: electron-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-v1-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('desktop/package-lock.json') }}

      - uses: actions/setup-python@v5
        if: steps.signed.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        if: steps.signed.outputs.cache-hit != 'true'
        with:
          version: "latest"

      - name: Install Python dependencies
        if: steps.signed.outputs.cache-hit != 'true'
        run: node desktop/scripts/retry-command.mjs bash -c "uv sync --group dev"

      - name: Install desktop dependencies
        working-directory: ./desktop
        run: node scripts/retry-command.mjs bash -c "npm ci"

      - name: Save Electron downloads before later steps can fail
        if: steps.electron-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/electron-cache
          key: ${{ steps.electron-cache.outputs.cache-primary-key }}

      - name: Test macOS checkpoint updater metadata
        if: startsWith(matrix.platform, 'macos')
        run: node --test desktop/scripts/prepare-mac-update.test.cjs

      - name: Apply requested app version
        shell: bash
        run: node desktop/scripts/set-release-version.mjs "$RELEASE_VERSION"

      - name: Build services
        if: steps.signed.outputs.cache-hit != 'true' && steps.services.outputs.cache-hit != 'true'
        working-directory: ./desktop
        run: npm run build:services

      - name: Save completed service build
        if: steps.signed.outputs.cache-hit != 'true' && steps.services.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: desktop/service-dist
          key: ${{ steps.services.outputs.cache-primary-key }}

      - name: Clean dist
        if: steps.signed.outputs.cache-hit != 'true'
        working-directory: ./desktop
        run: npx ts-node ./.erb/scripts/clean.js dist

      - name: Validate study configuration
        shell: bash
        run: |
          : "${COCO_GATEWAY_URL:?Missing repository variable COCO_GATEWAY_URL}"
          : "${LLM_ROUTER_URL:?Missing repository variable LLM_ROUTER_URL}"

          [[ "$COCO_GATEWAY_URL" == https://* ]] || {
            echo "COCO_GATEWAY_URL must use HTTPS" >&2
            exit 1
          }
          [[ "$LLM_ROUTER_URL" == https://* ]] || {
            echo "LLM_ROUTER_URL must use HTTPS" >&2
            exit 1
          }

      - name: Build Electron app
        if: steps.signed.outputs.cache-hit != 'true'
        working-directory: ./desktop
        run: npm run build

      - name: Verify embedded study configuration
        if: steps.signed.outputs.cache-hit != 'true'
        working-directory: ./desktop
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const bundle = fs.readFileSync("release/app/dist/main/main.js", "utf8");
            for (const name of ["COCO_GATEWAY_URL", "LLM_ROUTER_URL"]) {
              const value = process.env[name];
              if (!value || !bundle.includes(value)) {
                throw new Error(`${name} was not embedded in the main bundle`);
              }
            }
          '

      - name: Test updater and companion windows
        if: steps.signed.outputs.cache-hit != 'true'
        working-directory: ./desktop
        run: npm test -- --runInBand --silent --runTestsByPath src/main/app-updater.test.ts src/main/services/fullscreen-companion-window.test.ts

      - name: Validate macOS release secrets
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          MAC_CERT: ${{ secrets.MAC_CERT }}
          MAC_CERT_PWD: ${{ secrets.MAC_CERT_PWD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in MAC_CERT MAC_CERT_PWD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} )); then
            echo "Missing required GitHub Actions secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Prepare App Store Connect API key
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Build and sign macOS app
        if: startsWith(matrix.platform, 'macos') && steps.signed.outputs.cache-hit != 'true'
        working-directory: ./desktop
        run: >-
          node scripts/retry-command.mjs npx electron-builder build --publish never --${{ matrix.arch }} --dir -c.mac.notarize=false -c.afterPack=./scripts/prepare-mac-update.cjs
          -c.productName="Coco Learn Nightly"
          -c.appId=io.github.collaborative-agents.coco-learn-nightly
          -c.mac.publish.channel=nightly
          -c.mac.artifactName='coco-learn-nightly-${version}-${arch}-mac.${ext}'
        env:
          CSC_LINK: ${{ secrets.MAC_CERT }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PWD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Archive signed app checkpoint
        if: startsWith(matrix.platform, 'macos') && steps.signed.outputs.cache-hit != 'true'
        working-directory: ./desktop
        shell: bash
        run: |
          app_path="$(find release/build -maxdepth 2 -name 'Coco Learn Nightly.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$RUNNER_TEMP/coco-signed.zip"

      - name: Save signed app before contacting Apple
        if: startsWith(matrix.platform, 'macos') && steps.signed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/coco-signed.zip
          key: ${{ steps.signed.outputs.cache-primary-key }}

      - name: Restore app and identify notarization checkpoint
        if: startsWith(matrix.platform, 'macos')
        id: notarization
        working-directory: ./desktop
        shell: bash
        run: |
          # ditto preserves framework symlinks, modes, and the code signature.
          mkdir -p release/build/checkpoint
          ditto -x -k "$RUNNER_TEMP/coco-signed.zip" release/build/checkpoint
          echo "APP_PATH=$PWD/release/build/checkpoint/Coco Learn Nightly.app" >> "$GITHUB_ENV"
          digest="$(shasum -a 256 "$RUNNER_TEMP/coco-signed.zip" | cut -d ' ' -f 1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Restore Apple submission ID
        if: startsWith(matrix.platform, 'macos')
        id: submission
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/coco-notary.json
          # Tie the submission to the exact signed bytes, even if the app cache was evicted.
          key: notary-${{ steps.checkpoint.outputs.key }}-${{ steps.notarization.outputs.digest }}

      - name: Submit signed app to Apple
        if: startsWith(matrix.platform, 'macos') && steps.submission.outputs.cache-hit != 'true'
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node desktop/scripts/notarize-app.mjs submit "$RUNNER_TEMP/coco-signed.zip" "$RUNNER_TEMP/coco-notary.json"

      - name: Save Apple submission ID before waiting
        if: startsWith(matrix.platform, 'macos') && steps.submission.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/coco-notary.json
          key: ${{ steps.submission.outputs.cache-primary-key }}

      - name: Wait for Apple notarization
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        timeout-minutes: 85
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node desktop/scripts/notarize-app.mjs wait "$RUNNER_TEMP/coco-signed.zip" "$RUNNER_TEMP/coco-notary.json"

      - name: Staple notarization ticket
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: node desktop/scripts/retry-command.mjs xcrun stapler staple "$APP_PATH"

      - name: Verify macOS signature and notarization ticket
        if: startsWith(matrix.platform, 'macos')
        working-directory: ./desktop
        shell: bash
        run: |
          app_path="$APP_PATH"
          if [[ -z "$app_path" ]]; then
            echo "Packaged Coco Learn Nightly.app was not found" >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          node scripts/retry-command.mjs spctl --assess --verbose --type exec "$app_path"
          node scripts/retry-command.mjs xcrun stapler validate "$app_path"

          update_config="$APP_PATH/Contents/Resources/app-update.yml"
          if [[ ! -f "$update_config" ]]; then
            echo "Packaged app-update.yml was not found" >&2
            exit 1
          fi
          grep -q 'provider: github' "$update_config"
          grep -q 'owner: collaborative-agents' "$update_config"
          grep -qx 'repo: coco-learn' "$update_config"
          grep -qx 'channel: nightly' "$update_config"

      - name: Create installers from notarized macOS app
        if: startsWith(matrix.platform, 'macos')
        working-directory: ./desktop
        run: >-
          node scripts/retry-command.mjs npx electron-builder build --publish never --${{ matrix.arch }} --prepackaged "$APP_PATH" -c.mac.notarize=false
          -c.productName="Coco Learn Nightly"
          -c.appId=io.github.collaborative-agents.coco-learn-nightly
          -c.mac.publish.channel=nightly
          -c.mac.artifactName='coco-learn-nightly-${version}-${arch}-mac.${ext}'

      - name: Package Electron app (Windows)
        if: ${{ !startsWith(matrix.platform, 'macos') }}
        working-directory: ./desktop
        run: >-
          npx electron-builder build --publish never
          -c.productName="Coco Learn Nightly"
          -c.appId=io.github.collaborative-agents.coco-learn-nightly
          -c.win.publish.channel=nightly
          -c.win.artifactName='coco-learn-nightly-${version}-${arch}.${ext}'

      - name: Verify Windows differential update metadata
        if: matrix.platform == 'windows'
        working-directory: ./desktop
        shell: bash
        run: |
          update_config="$(find release/build -path '*/resources/app-update.yml' -print -quit)"
          if [[ -z "$update_config" ]]; then
            echo "Packaged Windows app-update.yml was not found" >&2
            exit 1
          fi
          grep -q 'provider: github' "$update_config"
          grep -q 'owner: collaborative-agents' "$update_config"
          grep -qx 'repo: coco-learn' "$update_config"
          grep -qx 'channel: nightly' "$update_config"

          mapfile -t installers < <(find release/build -maxdepth 1 -type f -name '*.exe' -print)
          if [[ "${#installers[@]}" -ne 1 ]]; then
            echo "Expected exactly one Windows NSIS installer, found ${#installers[@]}" >&2
            exit 1
          fi
          installer="${installers[0]}"
          if [[ ! -f "$installer.blockmap" ]]; then
            echo "Missing Windows differential blockmap: $installer.blockmap" >&2
            exit 1
          fi

          manifest="release/build/nightly.yml"
          if [[ ! -f "$manifest" ]]; then
            echo "Windows nightly.yml was not generated" >&2
            exit 1
          fi
          grep -Fq "version: $RELEASE_VERSION" "$manifest"
          grep -Fq "$(basename "$installer")" "$manifest"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: coco-learn-nightly-installer-${{ matrix.platform }}
          path: |
            desktop/release/build/*.dmg
            desktop/release/build/*-mac.zip
            desktop/release/build/*.exe
            desktop/release/build/*.blockmap
            desktop/release/build/nightly.yml
          overwrite: true
          retention-days: 7
          compression-level: 6
          if-no-files-found: error

  release:
    needs: [prepare, package]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coco-learn-nightly-installer-*
          path: artifacts

      - name: Create combined macOS update manifest
        if: ${{ inputs.package_macos_arm64 || inputs.package_macos_x64 }}
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node desktop/scripts/create-mac-update-manifest.mjs \
            --artifacts artifacts \
            --output artifacts/nightly-mac.yml \
            --version "$RELEASE_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Coco Learn Nightly v${{ needs.prepare.outputs.version }}
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.commit }}
          body: Nightly build from the `nightly` branch at ${{ needs.prepare.outputs.commit }}.
          files: artifacts/**
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
