name: Dependency compatibility

on:
  pull_request:
  push:
    branches: [main, dev/nv]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pi:
    name: Pi compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/release/app/package-lock.json
      # The compatibility job does not launch Electron or rebuild native addons.
      - name: Install locked desktop dependencies
        run: npm ci --ignore-scripts
      - name: Install locked Pi runtime dependencies
        run: npm --prefix release/app ci --ignore-scripts
      - name: Check the installed Pi dependency tree
        run: npm --prefix release/app ls --depth=0
      - name: Exercise Pi SDK, sessions, extensions, training tools and permissions
        run: npm run test:agent
      - name: Type-check the desktop integration
        run: npm run typecheck
      - name: Build the Electron application
        run: npm run build
      - name: Test desktop permission and agent integration
        run: npm run test:agent-host
